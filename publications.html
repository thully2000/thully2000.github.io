<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        font-family: "Segoe UI", Arial, sans-serif;
        background-color: #f4f6f9;
        margin: 0;
        color: #333;
      }
      .container {
        max-width: 900px;
        margin: auto;
        padding: 40px;
      }
      header {
        text-align: center;
        padding: 40px 0;
      }
      header h1 {
        margin-bottom: 10px;
        color: #003366;
        font-size: 3rem;
      }
      header p {
        font-size: 1.2rem;
        color: #666;
      }
      .card {
        background: white;
        padding: 25px;
        margin-bottom: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      }
      .nav-buttons {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
      }
      button {
        background-color: #003366;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
      }
      button:hover {
        background-color: #0055aa;
        transform: translateY(-2px);
      }
      .social-links a {
        display: inline-block;
        margin-right: 20px;
        text-decoration: none;
        color: #0055aa;
        font-weight: bold;
      }
      .social-links a:hover {
        text-decoration: underline;
      }
    </style>
    <title>Thomas Hull- Publications</title>
  </head>
  <body>
    <h1>This is where my publications live.</h1>
    <nav>
      <a href="index.html">Index</a>
    </nav>
  </body>
</html>
